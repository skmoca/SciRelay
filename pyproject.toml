[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scirelay"
version = "0.1.0"
description = "Communication-bounded multi-agent scientific evidence retrieval benchmark"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dense = [
  "huggingface-hub==0.34.4",
  "safetensors==0.5.3",
  "sentencepiece==0.2.0",
  "torch>=2.4,<3",
  "tokenizers==0.22.2",
  "transformers==4.57.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
